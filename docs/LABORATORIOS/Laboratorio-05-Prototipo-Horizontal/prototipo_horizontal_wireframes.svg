<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="60" y="50" fill="#F8FAFC" font-size="24" font-weight="bold">AlgoLearn — Prototipo Horizontal de Baja Fidelidad (Wireframes Balsamiq-Style)</text>
  <text x="60" y="80" fill="#94A3B8" font-size="14">TAIHC 6215 | UCV Facultad de Ciencias | Grupo #4: Jonathan Torres, Samuel Flores, Ricardo Riera, Diego Perdomo</text>

  <!-- SCREEN 1: Mobile Splash & Onboarding (x: 60, y: 110, w: 320, h: 640) -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <!-- Device Frame -->
    <rect width="320" height="640" rx="36" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <!-- Top Notch -->
    <rect x="110" y="10" width="100" height="18" rx="9" fill="#1E293B"/>
    
    <!-- Content -->
    <circle cx="160" cy="140" r="45" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="160" y="145" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">&lt;/&gt; ALGO</text>
    <text x="160" y="210" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="bold">AlgoLearn UCV</text>
    <text x="160" y="235" text-anchor="middle" fill="#64748B" font-size="12">Pensamiento Computacional</text>

    <!-- Value Prop Box -->
    <rect x="30" y="260" width="260" height="70" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="45" y="285" fill="#334155" font-size="11">✓ Aprende algoritmos paso a paso</text>
    <text x="45" y="303" fill="#334155" font-size="11">✓ Editor adaptativo en español</text>
    <text x="45" y="321" fill="#334155" font-size="11">✓ Modo Offline para el metro UCV</text>

    <!-- Buttons -->
    <rect x="30" y="360" width="260" height="44" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="160" y="387" text-anchor="middle" fill="#1E293B" font-size="13" font-weight="bold">Continuar con Google</text>

    <rect x="30" y="420" width="260" height="44" rx="8" fill="#2563EB"/>
    <text x="160" y="447" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Iniciar con Correo</text>

    <text x="160" y="500" text-anchor="middle" fill="#2563EB" font-size="12" text-decoration="underline">Explorar cursos sin registrarme &gt;</text>
    <text x="160" y="615" text-anchor="middle" fill="#94A3B8" font-size="10">W-01: Onboarding Directo</text>
  </g>

  <!-- SCREEN 2: Mobile Dashboard / Skill Tree (x: 420, y: 110, w: 320, h: 640) -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <rect width="320" height="640" rx="36" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <rect x="110" y="10" width="100" height="18" rx="9" fill="#1E293B"/>

    <!-- App Header -->
    <rect x="15" y="40" width="290" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="35" cy="60" r="12" fill="#CBD5E1"/>
    <text x="55" y="64" fill="#0F172A" font-size="12" font-weight="bold">Eduardo</text>
    <text x="180" y="64" fill="#D97706" font-size="12" font-weight="bold">🔥 5d</text>
    <text x="240" y="64" fill="#2563EB" font-size="12" font-weight="bold">⭐ 350XP</text>

    <!-- Section Title -->
    <text x="25" y="110" fill="#0F172A" font-size="14" font-weight="bold">Módulo 1: Lógica y Variables</text>
    <text x="25" y="128" fill="#64748B" font-size="11">Progreso: 66% completado</text>

    <!-- Skill Nodes -->
    <!-- Node 1 (Completed) -->
    <circle cx="160" cy="180" r="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
    <text x="160" y="186" text-anchor="middle" fill="#16A34A" font-size="18">★</text>
    <text x="160" y="225" text-anchor="middle" fill="#334155" font-size="11" font-weight="bold">1. ¿Qué es un Algoritmo?</text>

    <!-- Connector Line -->
    <line x1="160" y1="235" x2="160" y2="265" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4 4"/>

    <!-- Node 2 (Active/Current) -->
    <circle cx="160" cy="300" r="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
    <text x="160" y="307" text-anchor="middle" fill="#2563EB" font-size="16" font-weight="bold">▶</text>
    <text x="160" y="348" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="bold">2. Variables y Sintaxis</text>

    <!-- Connector Line -->
    <line x1="160" y1="360" x2="160" y2="390" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Node 3 (Locked) -->
    <circle cx="160" cy="425" r="28" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="160" y="431" text-anchor="middle" fill="#64748B" font-size="14">🔒</text>
    <text x="160" y="468" text-anchor="middle" fill="#94A3B8" font-size="11">3. Condicionales If/Else</text>

    <!-- Offline Button Banner -->
    <rect x="25" y="510" width="270" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="40" y="534" fill="#92400E" font-size="11">📥 Guardar lecciones para modo Offline</text>

    <!-- Bottom Nav -->
    <rect x="0" y="570" width="320" height="70" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="50" y="605" text-anchor="middle" fill="#2563EB" font-size="11" font-weight="bold">🏠 Aprender</text>
    <text x="160" y="605" text-anchor="middle" fill="#64748B" font-size="11">💬 Foros</text>
    <text x="270" y="605" text-anchor="middle" fill="#64748B" font-size="11">👤 Perfil</text>
  </g>

  <!-- SCREEN 3: Mobile Code Workspace with Adaptive Keyboard (x: 780, y: 110, w: 320, h: 640) -->
  <g transform="translate(780, 110)" filter="url(#shadow)">
    <rect width="320" height="640" rx="36" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <rect x="110" y="10" width="100" height="18" rx="9" fill="#1E293B"/>

    <!-- Header -->
    <text x="20" y="55" fill="#2563EB" font-size="14" font-weight="bold">&lt; Lección 2.2</text>
    <rect x="130" y="45" width="160" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="130" y="45" width="110" height="8" rx="4" fill="#2563EB"/>

    <!-- Instruction -->
    <rect x="15" y="70" width="290" height="55" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="90" fill="#0F172A" font-size="11" font-weight="bold">Reto: Asigna '18' a la variable 'edad'</text>
    <text x="25" y="108" fill="#475569" font-size="10">Escribe el código respetando minúsculas.</text>

    <!-- Code Editor Box -->
    <rect x="15" y="135" width="290" height="150" rx="8" fill="#1E293B"/>
    <text x="25" y="160" fill="#64748B" font-size="11" font-family="monospace">1 | # Escribe tu solución abajo:</text>
    <text x="25" y="185" fill="#38BDF8" font-size="12" font-family="monospace">2 | edad = 18</text>
    <text x="25" y="210" fill="#F87171" font-size="12" font-family="monospace">3 | Print(edad)  </text>
    <line x1="125" y1="198" x2="125" y2="214" stroke="#FFFFFF" stroke-width="2"/> <!-- Cursor -->

    <!-- Predictive Feedback Tooltip (<100ms) -->
    <rect x="25" y="225" width="270" height="52" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="35" y="243" fill="#991B1B" font-size="10" font-weight="bold">⚠️ Error Sintáctico Detectado:</text>
    <text x="35" y="258" fill="#B91C1C" font-size="9.5">'Print' está en mayúscula. Cámbialo por 'print'.</text>
    <text x="35" y="271" fill="#2563EB" font-size="9" font-weight="bold">[ Corregir a 'print' automáticamente ]</text>

    <!-- Programming Toolbar (Special Symbols) -->
    <rect x="0" y="295" width="320" height="35" fill="#E2E8F0"/>
    <text x="20" y="318" fill="#1E293B" font-size="13" font-family="monospace" font-weight="bold">{  }  (  )  :  =  &gt;  &lt;  ;</text>

    <!-- Action Bar -->
    <rect x="15" y="340" width="85" height="40" rx="8" fill="#EDE9FE" stroke="#8B5CF6"/>
    <text x="57" y="365" text-anchor="middle" fill="#6D28D9" font-size="11" font-weight="bold">💬 Foro (4)</text>

    <rect x="110" y="340" width="195" height="40" rx="8" fill="#10B981"/>
    <text x="207" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">⚡ Comprobar Solución</text>

    <!-- Simulated Native System Keyboard -->
    <rect x="0" y="390" width="320" height="250" fill="#CBD5E1"/>
    <text x="160" y="420" text-anchor="middle" fill="#475569" font-size="11">Teclado Nativo del Sistema Operativo</text>
    <rect x="15" y="435" width="290" height="170" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <text x="160" y="525" text-anchor="middle" fill="#64748B" font-size="11">(Disposición QWERTY estándar de Android/iOS)</text>
  </g>

  <!-- SCREEN 4: Web Desktop Split-Screen Workspace (x: 1140, y: 110, w: 400, h: 640) -->
  <g transform="translate(1140, 110)" filter="url(#shadow)">
    <!-- Browser Window Frame -->
    <rect width="400" height="640" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <!-- Browser Titlebar -->
    <rect width="400" height="32" rx="12" fill="#E2E8F0"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    <text x="200" y="20" text-anchor="middle" fill="#475569" font-size="10">algolearn.ciens.ucv.ve/app/leccion/2.2</text>

    <!-- Web Header -->
    <rect x="0" y="32" width="400" height="40" fill="#0F172A"/>
    <text x="20" y="56" fill="#38BDF8" font-size="13" font-weight="bold">&lt;/&gt; AlgoLearn Web</text>
    <text x="280" y="56" fill="#FFFFFF" font-size="11">Eduardo | ⭐ 350XP</text>

    <!-- Split Screen Left (Theory & Instruction) -->
    <rect x="10" y="80" width="180" height="490" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="20" y="105" fill="#0F172A" font-size="12" font-weight="bold">Diagrama de Flujo:</text>
    <!-- Mini Flowchart Box -->
    <rect x="30" y="120" width="140" height="30" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
    <text x="100" y="138" text-anchor="middle" fill="#1E3A8A" font-size="9.5">Inicio: edad &lt;- 18</text>
    <line x1="100" y1="150" x2="100" y2="175" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="100,175 140,195 100,215 60,195" fill="#FEF3C7" stroke="#D97706"/>
    <text x="100" y="198" text-anchor="middle" fill="#92400E" font-size="8.5">¿edad &gt;= 18?</text>

    <text x="20" y="245" fill="#0F172A" font-size="11" font-weight="bold">Instrucciones:</text>
    <text x="20" y="265" fill="#475569" font-size="9.5">1. Verifica la condición.</text>
    <text x="20" y="280" fill="#475569" font-size="9.5">2. Emite la salida adecuada.</text>

    <!-- Split Screen Right (Code Editor & Terminal) -->
    <rect x="200" y="80" width="190" height="340" fill="#0F172A" rx="4"/>
    <text x="210" y="105" fill="#38BDF8" font-size="10" font-family="monospace">main.py</text>
    <text x="210" y="130" fill="#64748B" font-size="10" font-family="monospace">1| edad = 18</text>
    <text x="210" y="150" fill="#F8FAFC" font-size="10" font-family="monospace">2| if edad &gt;= 18:</text>
    <text x="210" y="170" fill="#34D399" font-size="10" font-family="monospace">3|   print("Mayor")</text>

    <!-- Console Output -->
    <rect x="200" y="430" width="190" height="140" fill="#1E293B" rx="4"/>
    <text x="210" y="450" fill="#94A3B8" font-size="10">Consola de Salida:</text>
    <text x="210" y="475" fill="#4ADE80" font-size="10" font-family="monospace">&gt; Mayor</text>
    <text x="210" y="500" fill="#38BDF8" font-size="9.5">✓ 3 Casos de prueba OK</text>

    <!-- Action Bar Web -->
    <rect x="0" y="580" width="400" height="60" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="20" y="615" fill="#64748B" font-size="11">Atajos: [Ctrl+Enter] Ejecutar</text>
    <rect x="250" y="590" width="140" height="40" rx="6" fill="#10B981"/>
    <text x="320" y="615" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">Comprobar Reto</text>
  </g>

  <!-- Annotations / Callouts -->
  <rect x="60" y="780" width="1480" height="170" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="90" y="815" fill="#38BDF8" font-size="16" font-weight="bold">Decisiones Clave de Usabilidad e Interacción (PDCC-IHC):</text>
  <text x="90" y="845" fill="#E2E8F0" font-size="13">• <tspan font-weight="bold">Ergonomía de Entrada en Móvil:</tspan> Desacoplamiento total del teclado virtual. Se aprovecha el teclado nativo del SO y se agrega una franja de símbolos especiales para programación sin sacrificar visibilidad.</text>
  <text x="90" y="875" fill="#E2E8F0" font-size="13">• <tspan font-weight="bold">Retroalimentación Instantánea &lt;100ms:</tspan> El asistente predictivo señala la línea exacta y la causa lógica/sintáctica humanizada, suprimiendo la necesidad de videos largos o mensajes genéricos de error.</text>
  <text x="90" y="905" fill="#E2E8F0" font-size="13">• <tspan font-weight="bold">Persistencia Offline y Resiliencia:</tspan> Almacenamiento local mediante paquetes ligeros descargables para garantizar la continuidad académica ante fallas de red o durante el transporte en Caracas.</text>
</svg>
